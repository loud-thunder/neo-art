[package]
name = "neo-art"
version = "0.1.0"
edition = "2021"
description = "7-Layer Procedural Abstract Art NFT Generator & GUI for Octopin and Zora"

[dependencies]
eframe = "0.31"
egui = "0.31"
tiny-skia = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
noise = "0.9"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
